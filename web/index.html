<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Find your way around LASU Ojo campus. Explore places and get walking directions, online or offline." />
    <script>
      // Apply the device setting or saved choice before the application paints.
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("turnright:appearance");
          if (["system", "light", "dark"].includes(saved)) preference = saved;
        } catch { /* Storage may be unavailable in private browsing. */ }
        const dark = preference === "dark" ||
          (preference === "system" && !!window.matchMedia?.("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark ? "#202a36" : "#ffffff";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#202a36" : "#ffffff");
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>TurnRight · LASU Campus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
