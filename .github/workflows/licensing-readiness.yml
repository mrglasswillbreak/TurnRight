name: Licensing readiness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: licensing-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci && npm run setup
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          CAMPUS_ID: ci-non-default-campus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: web/coverage/
          retention-days: 30
  local-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci && npm run setup
      - run: python -m pip install --require-hashes -r scripts/requirements-data.lock
      - name: Build pinned editor container
        run: |
          docker build -t turnright-development .devcontainer
          docker run --rm turnright-development node --version
          docker run --rm turnright-development python --version
      - name: Start a fresh stack without hosted credentials
        run: |
          npm run local:up > /tmp/turnright-local.log 2>&1 &
          for attempt in $(seq 1 240); do
            if curl --fail --silent http://127.0.0.1:5180/packages/campuses.json > /dev/null; then exit 0; fi
            sleep 5
          done
          cat /tmp/turnright-local.log
          exit 1
      - run: npm run local:test
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: node --import ./web/node_modules/tsx/dist/loader.mjs scripts/local/browser.mts
      - name: Verify restart persistence
        run: |
          npm run local:down
          npm run local:up > /tmp/turnright-local.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5180/packages/campuses.json > /dev/null; then break; fi
            sleep 5
          done
          node --import ./web/node_modules/tsx/dist/loader.mjs scripts/local/acceptance.mts --persistence
      - name: Verify explicit local reset
        run: |
          npm run local:reset -- --confirm-local-reset
          npm run local:up > /tmp/turnright-local.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5180/packages/campuses.json > /dev/null; then break; fi
            sleep 5
          done
          npm run local:test -- --after-reset
      - name: Stop local services
        if: always()
        run: npm run local:down
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: local-stack-receipt
          path: .local-runtime/acceptance-receipt.json
          retention-days: 30
