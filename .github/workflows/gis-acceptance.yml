name: GIS database and engine acceptance
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  bounded-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      database:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: turnright_import_test
        ports: ['5432:5432']
        options: >-
          --memory 512m --memory-swap 512m
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/requirements-test.lock
      - run: python scripts/tests/check_import_queue_database.py
        env:
          GIS_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/turnright_import_test
      - name: Verify import retention and concurrent retry protection
        run: python scripts/tests/check_import_retention_database.py
        env:
          GIS_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/turnright_import_test
  native-postgis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: turnright_gis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/requirements-test.lock
      - run: python scripts/gis/check_database.py
        env:
          GIS_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/turnright_gis_test
      - name: Exercise backup restoration
        env:
          DATABASE_CONTAINER: ${{ job.services.database.id }}
        run: |
          docker exec "$DATABASE_CONTAINER" pg_dump -U postgres -Fc turnright_gis_test > /tmp/gis-backup.dump
          docker exec "$DATABASE_CONTAINER" createdb -U postgres -T template0 turnright_restore_test
          docker exec -i "$DATABASE_CONTAINER" pg_restore -U postgres -d turnright_restore_test --exit-on-error < /tmp/gis-backup.dump
          test "$(docker exec "$DATABASE_CONTAINER" psql -U postgres -d turnright_restore_test -Atc 'select count(*) from public.gis_feature_index')" = 100000
  isolated-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: docker build -t turnright-gis scripts/gis
      - name: Verify vector operations and real GeoPackage round trip
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,size=512m -v "$GITHUB_WORKSPACE/scripts:/app:ro" --entrypoint python3 turnright-gis -m unittest discover -s /app/tests -p 'test_gis_processing.py' -v
      - name: Verify actual private export worker and host cleanup
        run: node scripts/gis/check_worker.mjs
