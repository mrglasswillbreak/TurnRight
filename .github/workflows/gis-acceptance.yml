name: GIS database and engine acceptance
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native-postgis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: turnright_gis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'psycopg[binary]==3.2.12'
      - run: python scripts/gis/check_database.py
        env:
          GIS_TEST_DATABASE_URL: postgresql://postgres:disposable-test-only@127.0.0.1:5432/turnright_gis_test
      - name: Exercise backup restoration
        run: |
          docker exec "${{ job.services.database.id }}" pg_dump -U postgres -Fc turnright_gis_test > /tmp/gis-backup.dump
          docker exec "${{ job.services.database.id }}" createdb -U postgres -T template0 turnright_restore_test
          docker exec -i "${{ job.services.database.id }}" pg_restore -U postgres -d turnright_restore_test --exit-on-error < /tmp/gis-backup.dump
          test "$(docker exec "${{ job.services.database.id }}" psql -U postgres -d turnright_restore_test -Atc 'select count(*) from public.gis_feature_index')" = 100000
  isolated-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t turnright-gis scripts/gis
      - name: Verify vector operations and real GeoPackage round trip
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,size=512m -v "${{ github.workspace }}/scripts:/app:ro" --entrypoint python3 turnright-gis -m unittest discover -s /app/tests -p 'test_gis_processing.py' -v
