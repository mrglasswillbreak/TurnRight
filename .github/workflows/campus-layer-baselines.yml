name: Preserve campus layer baselines
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preserve existing layer receipts, encrypted GIS application backup, or apply the exact authorized GIS migration bundle"
        type: choice
        options: [baseline, backup, migrate]
        default: baseline
      backup_public_key:
        description: "Optional RSA public key for this encrypted backup; retain the private key separately"
        type: string
        required: false
      backup_excluded_tables:
        description: "Optional comma-separated restricted tables backed up separately through the database dashboard"
        type: string
        required: false
  push:
    branches: [codex/lasu-campus-layers]
    paths: [.github/workflows/campus-layer-baselines.yml]
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - if: inputs.mode == 'baseline' || inputs.mode == ''
        run: npx tsx ../scripts/audit-campus-layers.mts
        working-directory: web
      - if: inputs.mode == 'backup' || inputs.mode == 'migrate'
        run: node scripts/gis-deployment.mjs
        env:
          GIS_DEPLOYMENT_MODE: ${{ inputs.mode }}
          GIS_BACKUP_PUBLIC_KEY: ${{ inputs.backup_public_key }}
          GIS_BACKUP_EXCLUDED_TABLES: ${{ inputs.backup_excluded_tables }}
      - uses: actions/upload-artifact@v4
        with:
          name: campus-layer-baselines
          path: |
            web/work/campus-layer-baselines.json
            web/work/gis-deployment/
          if-no-files-found: error
          retention-days: 14
