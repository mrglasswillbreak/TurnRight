name: Prepare reviewed campus layer release
on:
  push:
    branches: [codex/lasu-campus-layers]
    paths: [.github/workflows/campus-layer-release.yml]
  workflow_dispatch:
    inputs:
      campus_id:
        type: choice
        options: [lasu, campus-eedb34e0-0310-47a0-afbf-2d2b7e8d9a2a]
        required: true
      operation:
        description: Inspect is a read-only model workspace audit; prepare validates the pinned inputs
        type: choice
        options: [prepare, apply, inspect, resume-review]
        default: prepare
      expected_hash:
        description: Reviewed complete workspace hash; required for apply
        required: false
      upgrade:
        type: choice
        options: [layers, detail, models]
        default: layers
      model_asset_id:
        description: Pinned proposal ZIP release asset ID from this repository (models only)
        required: false
      model_archive_sha256:
        description: Reviewed proposal ZIP SHA256 (models only)
        required: false
      expected_model_plan:
        description: Model preparation receipt planHash; required for apply
        required: false
      model_owner_override:
        description: Explicit original-owner approval after applying models; records the reason below
        type: boolean
        default: false
      model_override_reason:
        description: Audited original-owner approval reason (5–1000 characters); no independent approval claimed
        required: false
      reconciliation_pin:
        description: Pinned apply artifact JSON for inspect; resume-review additionally requires verified reconciliation artifact, workspace hash and review operation UUID
        required: false
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'resume-review' && inputs.upgrade != 'models' && !inputs.reconciliation_pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLISHED_MAP_URL: https://turnright.vercel.app
      CAMPUS_ID: ${{ inputs.campus_id }}
      APPLY_LAYER_UPGRADE: ${{ inputs.operation == 'apply' }}
      EXPECTED_SNAPSHOT: ${{ inputs.expected_hash }}
    steps:
      - name: Inspect is available only for model workspaces
        if: inputs.operation == 'inspect' && inputs.upgrade != 'models'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: web
      - if: inputs.upgrade == 'layers'
        run: npx tsx ../scripts/prepare-campus-layer-release.mts
        working-directory: web
      - if: inputs.upgrade == 'detail'
        run: npx tsx ../scripts/prepare-campus-detail-release.mts
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: campus-layer-release
          path: |
            web/work/*-layer-receipt.json
            web/work/*-layer-preview.json
            web/work/*-detail-receipt.json
          retention-days: 14
  models:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'resume-review' && inputs.upgrade == 'models' && !inputs.reconciliation_pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub requires push access to read assets attached to draft releases.
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLISHED_MAP_URL: https://turnright.vercel.app
      CAMPUS_ID: ${{ inputs.campus_id }}
      APPLY_LAYER_UPGRADE: ${{ inputs.operation == 'apply' }}
      EXPECTED_SNAPSHOT: ${{ inputs.expected_hash }}
      MODEL_RELEASE_ASSET_ID: ${{ inputs.model_asset_id }}
      MODEL_ARCHIVE_SHA256: ${{ inputs.model_archive_sha256 }}
      EXPECTED_MODEL_PLAN: ${{ inputs.expected_model_plan }}
      MODEL_OWNER_OVERRIDE: ${{ inputs.model_owner_override }}
      MODEL_OVERRIDE_REASON: ${{ inputs.model_override_reason }}
      MODEL_INSPECT_ONLY: ${{ inputs.operation == 'inspect' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsx ../scripts/prepare-campus-model-release.mts
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: campus-layer-release
          path: |
            web/work/lasu-model-receipt.json
            web/work/lasu-model-inspection.json
          retention-days: 14
  reconcile:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'resume-review' && inputs.reconciliation_pin != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLISHED_MAP_URL: https://turnright.vercel.app
      CAMPUS_ID: lasu
    steps:
      - name: Require read-only LASU model inspection
        if: inputs.operation != 'inspect' || inputs.upgrade != 'models' || inputs.campus_id != 'lasu'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(inputs.reconciliation_pin).apply_artifact_id }}
          run-id: ${{ fromJSON(inputs.reconciliation_pin).apply_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: web/work/model-apply-input
      - run: npm ci
        working-directory: web
      - name: Inspect the pinned saved operation without remote writes
        run: npx tsx ../scripts/reconcile-campus-model-apply.mts "$GITHUB_EVENT_PATH"
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lasu-model-reconciliation
          path: web/work/lasu-model-reconciliation.json
          retention-days: 14
  resume-review:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'resume-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lasu-model-review-recovery
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLISHED_MAP_URL: https://turnright.vercel.app
      CAMPUS_ID: lasu
    steps:
      - name: Require explicit main-branch LASU model review continuation
        if: github.ref != 'refs/heads/main' || inputs.upgrade != 'models' || inputs.campus_id != 'lasu' || !inputs.reconciliation_pin
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(inputs.reconciliation_pin).apply_artifact_id }}
          run-id: ${{ fromJSON(inputs.reconciliation_pin).apply_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: web/work/model-apply-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ fromJSON(inputs.reconciliation_pin).reconciliation_artifact_id }}
          run-id: ${{ fromJSON(inputs.reconciliation_pin).reconciliation_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: web/work/model-reconciliation-input
      - run: npm ci
        working-directory: web
      - run: npx vitest run tests/model-proposal-review-recovery.test.ts
        working-directory: web
      - name: Submit and record the pinned original-owner review decision
        run: npx tsx ../scripts/review-reconciled-models.mts "$GITHUB_EVENT_PATH"
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lasu-model-review-recovery
          path: web/work/lasu-model-review-recovery.json
          retention-days: 14
