name: Prepare reviewed campus layer release
on:
  push:
    branches: [codex/lasu-campus-layers]
    paths: [.github/workflows/campus-layer-release.yml]
  workflow_dispatch:
    inputs:
      campus_id:
        type: choice
        options: [lasu, campus-eedb34e0-0310-47a0-afbf-2d2b7e8d9a2a]
        required: true
      operation:
        type: choice
        options: [prepare, apply]
        default: prepare
      expected_hash:
        description: Reviewed complete workspace hash; required for apply
        required: false
      upgrade:
        type: choice
        options: [layers, detail]
        default: layers
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLISHED_MAP_URL: https://turnright.vercel.app
      CAMPUS_ID: ${{ inputs.campus_id }}
      APPLY_LAYER_UPGRADE: ${{ inputs.operation == 'apply' }}
      EXPECTED_SNAPSHOT: ${{ inputs.expected_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: web
      - if: inputs.upgrade != 'detail'
        run: npx tsx ../scripts/prepare-campus-layer-release.mts
        working-directory: web
      - if: inputs.upgrade == 'detail'
        run: npx tsx ../scripts/prepare-campus-detail-release.mts
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: campus-layer-release
          path: |
            web/work/*-layer-receipt.json
            web/work/*-layer-preview.json
            web/work/*-detail-receipt.json
          retention-days: 14
