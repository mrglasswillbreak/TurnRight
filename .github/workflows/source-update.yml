name: Review campus source updates
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: Optional editor job ID
        required: false
permissions:
  contents: read
concurrency:
  group: campus-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install bounded data import tools
        run: python -m pip install --require-hashes -r scripts/requirements-data.lock
      - name: Read accepted sources and owner corrections
        working-directory: web
        env:
          PUBLISHED_MAP_URL: https://turnright.vercel.app
        run: |
          npm ci
          node --import tsx scripts/enrichment-context.ts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/enrichment/overture-*
          key: overture-campus-v1-${{ github.run_id }}
          restore-keys: overture-campus-v1-
      - name: Verify campus access rules
        run: python -m unittest discover -s scripts/tests
      - name: Download bounded source snapshots
        run: python scripts/enrich_campus.py
      - name: Retain coverage and unresolved candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: campus-enrichment-review
          path: data/candidates/enrichment/
          retention-days: 30
      - name: Queue semantic changes for review
        run: node scripts/sync-sources.mjs
      - name: Record upstream failure
        if: failure()
        run: node scripts/record-failure.mjs
