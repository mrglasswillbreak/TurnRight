name: Check opted-in campus sources
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: campus-source-scheduler
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      OVERPASS_SCHEDULE_ALLOWED: ${{ vars.OVERPASS_SCHEDULE_ALLOWED }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_map_sources.py
