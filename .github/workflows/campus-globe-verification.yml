name: Verify published campus globe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - run: node scripts/verify-campus-globe.mjs
        working-directory: web
        env:
          VERIFY_BASELINE: ../docs/assets/campus-globe-baseline-2026-10-03.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-globe-verification
          path: web/work/campus-globe-verification
          retention-days: 14
