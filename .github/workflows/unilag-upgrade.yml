name: UNILAG detail release preparation
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [audit, prepare, apply]
        default: prepare
      expected_snapshot:
        type: string
        required: false
  push:
    branches: [codex/unilag-vector-detail]
    paths: [.github/workflows/unilag-upgrade.yml]
permissions:
  contents: read
concurrency:
  group: unilag-detail-preparation
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CAMPUS_ID: campus-eedb34e0-0310-47a0-afbf-2d2b7e8d9a2a
      PUBLISHED_MAP_URL: https://turnright.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - if: github.event_name == 'push' || inputs.operation == 'audit'
        run: mkdir -p work && npx tsx ../scripts/audit-unilag.mts
        working-directory: web
      - if: github.event_name == 'workflow_dispatch' && inputs.operation != 'audit'
        run: node ../scripts/preserve-unilag-road.mjs
        working-directory: web
      - if: github.event_name == 'workflow_dispatch' && inputs.operation != 'audit'
        run: mkdir -p work && npx tsx ../scripts/prepare-unilag-upgrade.mts
        working-directory: web
        env:
          APPLY_UNILAG: ${{ inputs.operation == 'apply' && 'true' || 'false' }}
          EXPECTED_UNILAG_SNAPSHOT: ${{ inputs.expected_snapshot }}
      - uses: actions/upload-artifact@v4
        with:
          name: unilag-baseline-receipt
          path: web/work/unilag-*.json
          retention-days: 7
