name: UNILAG detail release preparation
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [audit, prepare, apply, snapshot]
        default: prepare
      expected_snapshot:
        type: string
        required: false
      supersedes:
        description: Optional older preview to retire after creating the replacement snapshot
        type: string
        required: false
  push:
    branches: [codex/unilag-vector-detail]
    paths: [.github/workflows/unilag-upgrade.yml]
permissions:
  contents: read
concurrency:
  group: unilag-detail-preparation
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CAMPUS_ID: campus-eedb34e0-0310-47a0-afbf-2d2b7e8d9a2a
      PUBLISHED_MAP_URL: https://turnright.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: web
      - if: github.event_name == 'push' || inputs.operation == 'audit'
        run: mkdir -p work && npx tsx ../scripts/audit-unilag.mts
        working-directory: web
      - if: github.event_name == 'workflow_dispatch' && inputs.operation != 'audit'
        run: node ../scripts/preserve-unilag-road.mjs
        working-directory: web
      - if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'prepare' || inputs.operation == 'apply')
        run: mkdir -p work && npx tsx ../scripts/prepare-unilag-upgrade.mts
        working-directory: web
        env:
          APPLY_UNILAG: ${{ inputs.operation == 'apply' && 'true' || 'false' }}
          EXPECTED_UNILAG_SNAPSHOT: ${{ inputs.expected_snapshot }}
      - if: github.event_name == 'workflow_dispatch' && inputs.operation == 'snapshot'
        run: mkdir -p work && npx tsx ../scripts/snapshot-unilag-release.mts
        working-directory: web
        env:
          SUPERSEDES_UNILAG_RELEASE: ${{ inputs.supersedes }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unilag-baseline-receipt
          path: web/work/unilag-*.json
          retention-days: 7
