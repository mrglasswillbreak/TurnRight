name: Verify released campus detail
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Ready preview identity; empty verifies production
        required: false
      campus_id:
        default: campus-eedb34e0-0310-47a0-afbf-2d2b7e8d9a2a
        required: false
      scope:
        type: choice
        options: [all, offline-webkit, production, rollback]
        default: all
      cleanup_run:
        description: Optional preceding verification run whose temporary credential needs cleanup
        required: false
  push:
    branches: [codex/unilag-vector-detail]
    paths: [.github/workflows/campus-detail-verification.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      RELEASE_ID: ${{ inputs.release_id }}
      CAMPUS_ID: ${{ inputs.campus_id }}
      VERIFY_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx vitest run tests/release-promotion.test.ts tests/published-assets.test.ts
        working-directory: web
      - if: inputs.cleanup_run != ''
        run: node scripts/cleanup-preview-access.mjs
        env:
          CLEANUP_RUN_ID: ${{ inputs.cleanup_run }}
      - run: npx playwright install --with-deps chromium webkit
        if: inputs.scope != 'rollback'
        working-directory: web
      - if: inputs.release_id != ''
        run: node ../scripts/verify-release-preview.mjs
        working-directory: web
      - if: inputs.release_id == ''
        run: node scripts/verify-campus-detail.mjs
        working-directory: web
      - if: always() && inputs.release_id != ''
        run: node scripts/cleanup-preview-access.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-detail-verification
          path: |
            web/work/campus-detail-verification
            web/work/rollback-verification
          retention-days: 14
